<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>新規投稿</title>
</head>
<body>
  <h1>✏️ 投稿する</h1>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<p style="color:red">{{ m }}</p>{% endfor %}
  {% endwith %}
  <form method="post">
    <p>タイトル：<input type="text" name="title" required style="width:300px"></p>
    <p>内容：<textarea name="content" rows="8" cols="50" required></textarea></p>
    <p><input type="submit" value="投稿する"></p>
  </form>
  <p><a href="{{ url_for('index') }}">← トップに戻る</a></p>
</body>
</html>
