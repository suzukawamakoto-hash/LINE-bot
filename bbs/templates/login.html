<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ログイン</title>
</head>
<body>
  <h1>ログイン</h1>
  {% with messages = get_flashed_messages() %}
    {% for msg in messages %}<p style="color:red">{{ msg }}</p>{% endfor %}
  {% endwith %}
  <form method="post">
    <p>メールアドレス：<input type="email" name="email" required></p>
    <p>パスワード：<input type="password" name="password" required></p>
    <p><input type="submit" value="ログイン"></p>
  </form>
  <p><a href="{{ url_for('register') }}">新規登録はこちら</a></p>
</body>
</html>
